# Render settings for the ICGD API. Existing services keep their dashboard settings —
# make sure they match these (Settings → Build & Deploy).
services:
  - type: web
    name: icgd-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: MONGO_URL
        sync: false # set in the dashboard: your MongoDB Atlas connection string
      - key: DB_NAME
        value: icgd
      - key: JWT_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false # sk_test_… while testing, sk_live_… when live (Developers → API keys)
      - key: STRIPE_WEBHOOK_SECRET
        sync: false # whsec_… from the webhook destination for /api/payments/stripe/webhook
      - key: ADMIN_INITIAL_PASSWORD
        sync: false # only used if the database has no admin user yet
      # Locked out? Add ADMIN_RESET_PASSWORD (and optionally ADMIN_RESET_USERNAME, default "admin"),
      # let the service redeploy, log in, then delete the variable.
